[project]
name = "nasdaq-agent"
version = "0.1.0"
description = "Proof of concept: NASDAQ top-gainer analysis agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.4,<1.5",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain-google-genai>=3,<4",
  "langchain-anthropic>=1,<2",
  "langchain-openai>=1.6,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pandas-market-calendars>=5.4,<6",
  "yfinance>=1.7,<2",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "typer>=0.15,<1",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pytest-timeout>=2", "ruff>=0.6"]

[project.scripts]
nasdaq-agent = "nasdaq_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nasdaq_agent*"]

[tool.setuptools.package-data]
nasdaq_agent = ["report/templates/*.j2", "agent/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a reachable Docker daemon", "e2e: replay end to end"]
timeout = 60
pythonpath = ["."]
# Silences upstream deprecations in pandas-market-calendars 5.4 and exchange_calendars; should be removed on upgrade
filterwarnings = ["ignore::DeprecationWarning:pandas_market_calendars.*", "ignore::DeprecationWarning:exchange_calendars.*"]
